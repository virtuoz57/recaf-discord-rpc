plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.0'
}

group = 'dev.recaf.rpc'
version = '1.1.0'

repositories { mavenCentral() }

def recafJar = providers.gradleProperty('recafJar')
        .map { file(it) }
        .getOrElse(layout.buildDirectory.file('recaf-api/recaf-4.0.0-alpha.jar').get().asFile)

tasks.register('prepareRecafApi') {
    outputs.file(recafJar)
    doLast {
        if (!recafJar.exists()) {
            if (providers.gradleProperty('recafJar').isPresent())
                throw new GradleException("Recaf JAR does not exist: ${recafJar}")
            recafJar.parentFile.mkdirs()
            def url = new URI('https://github.com/Col-E/Recaf/releases/download/4.0.0-alpha/recaf-4x-alpha-win-86-x64.jar').toURL()
            def part = new File(recafJar.path + '.part')
            try {
                url.withInputStream { input -> part.withOutputStream { it << input } }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                part.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                def actual = java.util.HexFormat.of().formatHex(digest.digest())
                if (actual != 'd84f35c8d681d84a6c085e1aea7a4fe4e14d7046eecae9a2b3a07c7d6eee1aec')
                    throw new GradleException('Recaf API download checksum mismatch')
                java.nio.file.Files.move(part.toPath(), recafJar.toPath())
            } finally { part.delete() }
        }
    }
}

dependencies {
    compileOnly files(recafJar)
    testImplementation files(recafJar)
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'prepareRecafApi'
    options.release = 22
    options.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
    dependsOn shadowJar
    doFirst { systemProperty 'pluginJar', tasks.shadowJar.archiveFile.get().asFile.absolutePath }
    systemProperty 'RECAF_DIR', layout.buildDirectory.dir('test-recaf').get().asFile.absolutePath
}
jar {
    archiveClassifier = 'thin'
    from('LICENSE') { into 'META-INF' }
}
shadowJar {
    archiveClassifier = ''
    relocate 'com.google.gson', 'dev.recaf.rpc.internal.gson'
    exclude 'META-INF/versions/**/module-info.class', 'module-info.class'
    from('LICENSE') { into 'META-INF' }
}
build { dependsOn shadowJar }
